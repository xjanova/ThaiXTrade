# ⛔ ไฟล์นี้ไม่ใช่ของจริงที่รันอยู่ — อย่าเอาไป apply กับเซิร์ฟเวอร์
#
# ตัวจริงคือ TPIX-Coin/infrastructure/single-host/docker-compose.yml
# (สำเนาที่ใช้งานจริงอยู่ที่ /opt/tpix/docker-compose.yml บนเครื่อง tpixserver)
#
# ไฟล์นี้ล้าหลังอย่างน้อย 3 เรื่อง:
#   - image เป็น :latest ไม่ปักรุ่น (ตัวจริงปัก 0.9.0 เพราะ genesis เปิด fork แค่ london)
#   - ไม่มี GOGC/GOMEMLIMIT ที่กัน GC pause จนพลาดรอบ propose (ต้นเหตุเชนค้าง 38 ชม.)
#   - ไม่มี --max-enqueued และ block-gas-target ที่ปรับตอนทำด่านกันยิงถล่ม mempool
#
# เก็บไว้เป็นเอกสารอ้างอิงเท่านั้น ถ้าจะแก้ค่าเชนจริงให้ไปแก้ที่ TPIX-Coin
# แล้ว apply ด้วย infrastructure/single-host/apply-rolling.sh (ห้าม compose down)

# TPIX Chain — Polygon Edge (IBFT PoA, 4 validators)
# Developed by Xman Studio

version: '3.8'

services:
  # Validator Node 1 (Boot node)
  validator-1:
    image: 0xpolygon/polygon-edge:latest
    container_name: tpix-validator-1
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --block-gas-target 0x1312D00
      --price-limit 0
    volumes:
      - validator1-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8545:8545"   # JSON-RPC (หลัก)
      - "10000:10000"  # gRPC
      - "10001:10001"  # libp2p
    networks:
      - tpix-net
    restart: unless-stopped

  # Validator Node 2
  validator-2:
    image: 0xpolygon/polygon-edge:latest
    container_name: tpix-validator-2
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --price-limit 0
    volumes:
      - validator2-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8546:8545"
    networks:
      - tpix-net
    restart: unless-stopped
    depends_on:
      - validator-1

  # Validator Node 3
  validator-3:
    image: 0xpolygon/polygon-edge:latest
    container_name: tpix-validator-3
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --price-limit 0
    volumes:
      - validator3-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8547:8545"
    networks:
      - tpix-net
    restart: unless-stopped
    depends_on:
      - validator-1

  # Validator Node 4
  validator-4:
    image: 0xpolygon/polygon-edge:latest
    container_name: tpix-validator-4
    command: >
      server
      --data-dir /data
      --chain /genesis/genesis.json
      --grpc-address 0.0.0.0:10000
      --libp2p 0.0.0.0:10001
      --jsonrpc 0.0.0.0:8545
      --seal
      --max-slots 4096
      --price-limit 0
    volumes:
      - validator4-data:/data
      - ./genesis.json:/genesis/genesis.json:ro
    ports:
      - "8548:8545"
    networks:
      - tpix-net
    restart: unless-stopped
    depends_on:
      - validator-1

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:

networks:
  tpix-net:
    driver: bridge
