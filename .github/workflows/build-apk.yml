name: Legacy RN APK (manual build only)

# The React Native app in mobile/ was replaced by the Flutter app in mobile-flutter/ on 2026-04-13.
# แอป React Native ใน mobile/ เลิกใช้แล้ว แอปจริงคือ Flutter ใน mobile-flutter/ ตั้งแต่ 2026-04-13
#
# This workflow used to run on every push to main that touched mobile/**, bump version.json and
# attach its APK to that version's GitHub release. Both apps name the file TPIX-TRADE-v<version>.apk,
# so the RN build replaced the Flutter APK on v1.1.72 (2026-04-19) and v1.1.238 (2026-10-20), and
# /api/v1/app/update-check offered it as the update. Its package is com.xmanstudio.tpixtrade, not
# com.xmanstudio.tpix_trade, so phones installed it as a second "TPIX TRADE" app instead.
#
# It now runs only by hand, with a read-only token, and only leaves a workflow artifact:
# no version bump, no push, no release, no backend notify. App releases come from build-flutter-apk.yml.
# ตอนนี้รันได้แค่กดเอง token อ่านอย่างเดียว ได้แค่ artifact — ไม่ bump เวอร์ชัน ไม่ push ไม่แตะ release
# ไม่แจ้ง backend · release ของแอปมาจาก build-flutter-apk.yml ที่เดียว

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build legacy RN APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: mobile/node_modules
          key: ${{ runner.os }}-mobile-node-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: ${{ runner.os }}-mobile-node-

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # The RN app's own version from mobile/app.json. version.json belongs to the Flutter app now,
      # and naming an RN file after it is how the two apps got mixed up on the release page.
      # ใช้เวอร์ชันของแอป RN เอง (mobile/app.json) ไม่ใช่ version.json ซึ่งเป็นของแอป Flutter แล้ว
      - name: Get version info
        id: version
        run: |
          VERSION=$(node -e "console.log(require('./app.json').expo.version)")
          BUILD=$(node -e "console.log(require('./app.json').expo.android.versionCode)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Legacy RN app v$VERSION (build $BUILD)"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Run lint and type check before build
      - name: Lint & type check
        run: npx tsc --noEmit || echo "TypeScript check completed"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Workaround: foojay-resolver plugin download fails intermittently (403 from CDN)
      # Since Java is already provided by setup-java action, we don't need auto-download
      - name: Disable Gradle toolchain auto-download
        run: |
          # Patch @react-native/gradle-plugin to skip foojay-resolver
          SETTINGS_KTS="node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          if [ -f "$SETTINGS_KTS" ]; then
            echo "=== Before patch ==="
            grep -n foojay "$SETTINGS_KTS" || true
            # Comment out the entire plugins block containing foojay
            sed -i '/foojay/s/^/\/\/ /' "$SETTINGS_KTS"
            echo "=== After patch ==="
            grep -n foojay "$SETTINGS_KTS" || true
            echo "=== Full file ==="
            cat "$SETTINGS_KTS"
          else
            echo "WARNING: $SETTINGS_KTS not found!"
            find node_modules/@react-native -name "settings.gradle*" 2>/dev/null || true
          fi
          # Also disable auto-download in gradle.properties
          echo "org.gradle.java.installations.auto-download=false" >> android/gradle.properties

      - name: Build APK (Release)
        run: |
          cd android
          # Retry Gradle build up to 3 times (transient CDN/network failures)
          BUILD_SUCCESS=false
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if ./gradlew assembleRelease \
              -PversionName="${{ steps.version.outputs.version }}" \
              -PversionCode=${{ steps.version.outputs.build }} \
              --build-cache; then
              BUILD_SUCCESS=true
              break
            fi
            echo "Build attempt $i failed, retrying in 30s..."
            # Clean Gradle caches before retry to avoid stale state
            rm -rf ~/.gradle/caches/modules-2/files-2.1/org.gradle.toolchains 2>/dev/null || true
            sleep 30
          done
          if [ "$BUILD_SUCCESS" != "true" ]; then
            echo "All build attempts failed!"
            exit 1
          fi
          # Verify APK was created
          echo "=== APK files found ==="
          find . -name "*.apk" -type f -ls || echo "WARNING: No APK files found"

      - name: Find and rename APK
        id: find-apk
        run: |
          echo "=== Searching for APK files ==="
          find android -name "*.apk" -type f 2>/dev/null || true
          APK_PATH=$(find android -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          APK_NAME="TPIX-TRADE-RN-legacy-v${{ steps.version.outputs.version }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: TPIX-TRADE-RN-legacy-v${{ steps.version.outputs.version }}
          path: mobile/${{ steps.find-apk.outputs.apk_path }}
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## Legacy RN APK (artifact only, not released)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.version }} (mobile/app.json)" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** #${{ steps.version.outputs.build }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ steps.find-apk.outputs.apk_path }}" ]; then
            SIZE=$(du -h "${{ steps.find-apk.outputs.apk_path }}" | cut -f1)
            echo "**APK Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
