name: Auto Deploy to Production

on:
  workflow_run:
    workflows: ["CI - Tests & Quality Checks"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI checks (fast deploy)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  pre-check:
    name: Pre-deploy Check
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --prefer-dist --no-interaction --no-dev --optimize-autoloader
      - run: php -l routes/api.php
      - run: php -l routes/web.php

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-check]
    if: >
      always() &&
      (needs.pre-check.result == 'success' || github.event.inputs.skip_ci == 'true')

    steps:
      - name: Check SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Required SSH secrets are not configured."
            echo "Please set: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY"
            echo "Optional: SSH_PORT (defaults to 22), DEPLOY_PATH, APP_URL"
            exit 1
          fi
          echo "✓ SSH secrets configured"

      - name: Deploy via SSH (git pull + optimize)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 7 นาที: ปกติ ~100 วินาที + รองานตามตารางที่ค้างได้ถึง 90 วินาที (ดูหน้าต่าง deploy ข้างล่าง)
          # ต้องสั้นกว่า DeployWindow::MAX_AGE_SECONDS (15 นาที) เสมอ ไม่งั้นธงหมดอายุกลาง deploy
          command_timeout: 7m
          # ⚠️ ค่าเริ่มต้นของ action นี้คือ false = ผลลัพธ์ทุกอย่างที่เซิร์ฟเวอร์พิมพ์
          #    ไม่ถูกส่งกลับมาที่ Actions เลย เห็นแต่ตัวสคริปต์ที่ส่งไป
          #    ที่ผ่านมา migration ล้มเหลวจึงเงียบสนิท: deploy เขียว แต่ตารางไม่ขึ้น
          #    และไม่มีใครรู้จนกว่าจะมีคนเปิดหน้าเว็บแล้วเจอ 500
          capture_stdout: true
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/home/admin/domains/tpix.online}"

            echo "🚀 Starting deployment to ${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            # Backup .env — สิทธิ์ 600 ตั้งแต่ตอนสร้าง แล้วเก็บไว้แค่ 5 ไฟล์ล่าสุด
            #
            # .env มีรหัส keystore กระเป๋าร้อนและคีย์ทุกตัว ของเดิม cp ด้วย umask ปกติ (664)
            # ทุกรอบ deploy และไม่เคยลบ — prod สะสม 603 ไฟล์ 551 ไฟล์อ่านได้ทั้งกลุ่ม (ออดิท 2026-10-29 C3)
            # แตะเฉพาะชื่อ .env.backup.YYYYMMDD_HHMMSS ที่ตรงนี้สร้าง — ไฟล์สำรองที่ทำมือไม่ถูกลบ
            ENV_BACKUP=".env.backup.$(date +%Y%m%d_%H%M%S)"
            (umask 077 && cp .env "$ENV_BACKUP") 2>/dev/null && chmod 600 "$ENV_BACKUP" 2>/dev/null || true
            ENV_BACKUPS=$(ls -1A | grep -E '^\.env\.backup\.[0-9]{8}_[0-9]{6}$' | sort -r || true)
            if [ -n "$ENV_BACKUPS" ]; then
              echo "$ENV_BACKUPS" | while IFS= read -r f; do chmod 600 "$f" 2>/dev/null || true; done
              echo "$ENV_BACKUPS" | tail -n +6 | while IFS= read -r f; do rm -f -- "$f" 2>/dev/null || true; done
              echo "✓ .env backups: kept $(echo "$ENV_BACKUPS" | head -5 | wc -l) newest (mode 600)"
            fi

            # ── หน้าต่าง deploy: หยุดงานตามตารางจนโค้ด schema และแคชตรงกัน ──────────
            #
            # cron เรียก schedule:run ทุกนาทีตลอด deploy — ระหว่าง git reset → migrate →
            # config:cache โค้ดใหม่วิ่งบน schema เก่าและแคชคอนฟิกของรอบก่อน
            # เกิดจริง 2026-10-29 deploy v1.1.263: tpix:treasury-payouts ล้ม 15:08 และ 15:09
            # (Unknown column 'nonce') · 2026-10-22: validators:seal-monitor รันก่อนตารางถูกสร้าง
            #
            # routes/console.php ผูก skip() ให้ทุกงาน: มีไฟล์นี้ = ข้ามรอบ (App\Support\DeployWindow)
            # ธงที่เก่ากว่า 15 นาทีถูกมองข้าม — กัน scheduler หยุดถาวรถ้า trap ไม่ได้ทำงาน
            # ไม่ใช้ `php artisan down` เพราะเว็บและ API จะตอบ 503 ตลอดช่วงนี้ทั้งที่ปัญหาอยู่ฝั่ง scheduler
            #
            # ⚠️ trap ต้องลบธงเสมอ — set -e ตัดสคริปต์กลางทางได้ทุกบรรทัด และ SSH หลุดได้
            DEPLOY_FLAG="$(pwd)/storage/framework/deploy-in-progress"
            DRAIN_MAX_SECONDS=90

            end_deploy_window() {
              [ -e "$DEPLOY_FLAG" ] || [ -e "$DEPLOY_FLAG.skipped" ] || return 0
              SKIPPED_TASKS=$(cat "$DEPLOY_FLAG.skipped" 2>/dev/null || true)
              # ลบก่อนพิมพ์ — ถ้า SSH หลุดไปแล้ว echo จะล้ม แต่ธงต้องหายไปก่อนแล้ว
              rm -f "$DEPLOY_FLAG" "$DEPLOY_FLAG.skipped"
              echo "🔓 Scheduler released" || true
              if [ -n "$SKIPPED_TASKS" ]; then
                echo "::warning::งานตามตารางที่รอบถัดไปอีกนานถูกข้ามระหว่าง deploy — รันเองถ้ารอรอบหน้าไม่ได้:" || true
                echo "$SKIPPED_TASKS" || true
              fi
            }
            trap end_deploy_window EXIT
            trap 'exit 1' HUP INT PIPE TERM

            # งานที่เริ่มก่อนวางธงยังวิ่งด้วยโค้ดเดิม — git reset ตอนมันยังไม่จบ = autoload คลาสใหม่กลางรอบ
            # (เช่นส่งธุรกรรมไปแล้วแต่บันทึกผลด้วยโค้ดที่ schema ยังไม่รองรับ) จึงรอให้จบก่อน
            # นับเฉพาะโปรเซส "php … artisan" ที่ cwd เป็นแอปนี้ — user นี้มีหลายแอปบนเครื่องเดียวกัน
            # ต้องมีเพดาน: php83 ไม่มี pcntl = --timeout ของคิวไม่ทำงาน งานค้างได้นานจริง
            wait_for_running_tasks() {
              if ! command -v pgrep >/dev/null 2>&1 || [ ! -d /proc ]; then
                echo "::warning::ไม่มี pgrep หรือ /proc — ไม่ได้รองานตามตารางที่วิ่งอยู่ให้จบก่อน git reset"
                return 0
              fi
              APP_REAL="$(pwd -P)"
              WAITED=0
              while :; do
                BUSY=""
                for PID in $(pgrep -u "$(id -u)" -f '^[^ ]*php[^ ]* ([^ ]*/)?artisan( |$)' || true); do
                  if [ "$(readlink "/proc/$PID/cwd" 2>/dev/null)" = "$APP_REAL" ]; then
                    BUSY="$BUSY $PID"
                  fi
                done
                if [ -z "$BUSY" ]; then
                  echo "✓ No scheduled task still running (waited ${WAITED}s)"
                  return 0
                fi
                if [ "$WAITED" -ge "$DRAIN_MAX_SECONDS" ]; then
                  echo "::warning::งานตามตารางยังไม่จบหลังรอ ${WAITED} วินาที — deploy ต่อเลย งานเหล่านี้อาจเจอโค้ดใหม่กลางรอบ:"
                  ps -o pid=,etime=,args= -p "$(echo $BUSY | tr ' ' ',')" 2>/dev/null || true
                  return 0
                fi
                sleep 3
                WAITED=$((WAITED + 3))
              done
            }

            # เขียนธงไม่ได้ = set -e หยุดตรงนี้ ก่อนแตะโค้ด (ไม่ deploy ดีกว่า deploy โดยไม่มีด่าน)
            echo "deploy ${{ github.sha }} $(date -u +%FT%TZ)" > "$DEPLOY_FLAG"
            echo "🔒 Scheduler held until code, schema and caches match"

            # Pull latest code — ผ่าน SSH ไม่ใช่ PAT
            #
            # ★ ห้ามกลับไปใช้ `git remote set-url` ที่ฝัง token ใน URL อีก
            #   ของเดิมเขียน https://x-access-token:<PAT>@github.com/... ลง .git/config
            #   ทุกครั้งที่ deploy → token ค้างบนเครื่องเป็นข้อความธรรมดา อ่านได้จาก
            #   .git/config และโผล่เต็ม ๆ ทุกครั้งที่ใครรัน `git remote -v`
            #   (ตรวจพบ 2026-09-23 ตอนไล่ตรวจความปลอดภัยหลังบ้าน)
            #
            #   คีย์ของเครื่อง (~/.ssh/id_ed25519) ผูกกับบัญชี GitHub อยู่แล้ว —
            #   ยืนยันด้วย `ssh -T git@github.com` ได้ "Hi xjanova!" จึงดึง repo
            #   ไพรเวทได้โดยไม่ต้องมี token สักตัว
            echo "📥 Pulling latest code..."
            git remote set-url origin "git@github.com:xjanova/ThaiXTrade.git"
            git fetch origin main
            wait_for_running_tasks
            git reset --hard origin/main

            # Set GITHUB_TOKEN in .env for GitHub API access (App Releases)
            if [ -n "${{ secrets.GH_PAT }}" ]; then
              if grep -q '^GITHUB_TOKEN=' .env 2>/dev/null; then
                sed -i "s|^GITHUB_TOKEN=.*|GITHUB_TOKEN=${{ secrets.GH_PAT }}|" .env
              else
                echo "GITHUB_TOKEN=${{ secrets.GH_PAT }}" >> .env
              fi
              echo "✓ GITHUB_TOKEN set in .env"
            fi

            # Install composer dependencies
            echo "📦 Installing composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-gmp 2>&1 || {
              echo "⚠️ Composer install failed, trying with --no-scripts"
              composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --ignore-platform-req=ext-gmp
            }

            # Install NPM and build assets
            echo "🏗️ Building frontend assets..."
            rm -rf node_modules 2>/dev/null || true
            npm install --no-audit --no-fund 2>&1
            # build ลงโฟลเดอร์แยกแล้วค่อยสลับ — ห้าม build ทับ public_html/build ตรง ๆ
            # (ช่วง build ไฟล์ CSS หาย → 404 ที่ Cloudflare ให้มือถือแคช 1 ปี → เว็บไม่มี CSS)
            bash scripts/build-assets-atomic.sh 2>&1

            # Run migrations + seeders
            echo "🗃️ Running migrations..."
            # เก็บ exit code ไว้ก่อน แล้วค่อยรายงาน — ที่ผ่านมาใช้ `|| echo` เฉยๆ
            # ทำให้ migration ที่ล้มเหลวเงียบสนิท: deploy ขึ้นเขียว โค้ดใหม่ขึ้นเซิร์ฟ
            # แต่ตารางไม่มี → หน้าเว็บ 500 โดยไม่มีใครรู้จนกว่าจะมีคนกดเจอ
            if php artisan migrate --force 2>&1; then
              echo "✅ Migrations OK"
            else
              echo "::error::MIGRATION FAILED — โค้ดใหม่ขึ้นแล้วแต่ schema ยังไม่ตาม อาจ 500 ได้"
              echo "❌ MIGRATION FAILED (ดูข้อความข้างบน)"
            fi

            # รายงาน migration ที่ยังค้างเสมอ — ตัวเลขนี้ต้องเป็น 0 หลัง deploy สำเร็จ
            PENDING=$(php artisan migrate:status 2>/dev/null | grep -c "Pending" || true)
            if [ "${PENDING:-0}" -gt 0 ]; then
              echo "::error::ยังมี migration ค้าง ${PENDING} ตัว — ฟีเจอร์ใหม่จะยังใช้ไม่ได้"
              php artisan migrate:status 2>/dev/null | grep "Pending" || true
            else
              echo "✅ ไม่มี migration ค้าง"
            fi
            # ── seeders ──────────────────────────────────────────────────────
            # seeder ที่ล้มไม่ทำให้ deploy ล้ม (แถวเดิมยังอยู่ครบ) แต่ต้อง "มองเห็น" ใน Actions
            # ที่ผ่านมา `|| echo "warning"` กลืน exception ไว้ → BaseTokensSeeder ล้มเงียบ
            # ทุกรอบ deploy ตั้งแต่ 2026-08-21 ถึง 2026-09-03 (1062 Duplicate entry หลัง
            # Polygon เปลี่ยน MATIC → POL) โดยเห็นได้แค่ใน storage/logs/laravel-*.log บนเซิร์ฟ
            # ชื่อ seeder ใส่แบบไม่มี namespace ได้ — artisan db:seed เติม Database\Seeders\ ให้เอง
            SEEDERS_FAILED=0
            run_seeder() {
              if php artisan db:seed --class="$1" --force 2>&1; then
                echo "✅ seeder $1"
              else
                SEEDERS_FAILED=$((SEEDERS_FAILED + 1))
                echo "::error::SEEDER FAILED: $1 — ดู exception ข้างบน (แถวเดิมยังอยู่ แต่ข้อมูลใหม่ของ seeder นี้ไม่ถูกใส่)"
              fi
            }

            echo "🌱 Running ecosystem seeder..."
            run_seeder TpixEcosystemSeeder

            # bootstrap/cache/config.php เก็บค่า config ทุกตัวเป็นข้อความธรรมดา (รหัส keystore กระเป๋าร้อน,
            # DEPLOYER_PRIVATE_KEY ฯลฯ) — config:cache เขียนเป็น 664 ตาม umask เครื่อง และ chmod -R 775 ข้างล่าง
            # ทำให้เป็น 775 ทุกรอบ (ออดิท 2026-10-29 C3) · php-fpm รันเป็น user เดียวกับที่ deploy
            # (เจ้าของไฟล์) จึงอ่านได้ที่ 640 — ถ้า deploy เป็น root ข้ามไป ไม่งั้นไฟล์เป็นของ root แล้ว php-fpm อ่านไม่ได้ เว็บล่ม
            lock_config_cache() {
              CONFIG_CACHE="bootstrap/cache/config.php"
              if [ -f "$CONFIG_CACHE" ] && [ "$(id -u)" -ne 0 ] && [ -O "$CONFIG_CACHE" ]; then
                # set -e อยู่ — chmod พลาดต้องไม่ทำให้ deploy ล้มกลางคัน (เว็บยังใช้ไฟล์เดิมได้)
                if chmod 640 "$CONFIG_CACHE"; then
                  echo "✓ $CONFIG_CACHE mode 640"
                else
                  echo "::warning::chmod 640 $CONFIG_CACHE ไม่สำเร็จ"
                fi
              else
                echo "::warning::ไม่ได้ล็อกสิทธิ์ $CONFIG_CACHE (ไม่มีไฟล์ / deploy เป็น root / ไม่ใช่เจ้าของไฟล์)"
              fi
            }

            # Clear and rebuild caches
            echo "⚡ Optimizing application..."
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            lock_config_cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache 2>/dev/null || true

            # บทความหมวดเรียนรู้ (วิดีโอสอนใช้งาน) ตาม config/learn.php — สร้าง/อัปเดต ไม่ปลุกบทความที่แอดมินลบ
            # ต้องรันหลัง config:cache — ก่อนหน้านั้นแคชคอนฟิกของรอบก่อนยังไม่มี learn.lessons (seeder จะเห็นว่าว่างแล้วจบเงียบ)
            run_seeder LearnLessonsSeeder

            # Storage symlink สำหรับ file uploads (logo, banners, etc.)
            # Laravel ใช้ public_html (ไม่ใช่ public) — สร้าง symlink ถูกที่
            if [ ! -L "public_html/storage" ]; then
              rm -rf public_html/storage 2>/dev/null || true
              ln -sf "$(pwd)/storage/app/public" "$(pwd)/public_html/storage"
              echo "✅ Created storage symlink: public_html/storage → storage/app/public"
            else
              echo "✅ Storage symlink exists"
            fi

            # สร้างโฟลเดอร์ upload
            mkdir -p storage/app/public/logos storage/app/public/favicons storage/app/public/seo storage/app/public/articles 2>/dev/null || true

            # รัน seeders ตามลำดับ: chains → tokens → trading pairs (idempotent)
            run_seeder AllChainsSeeder
            run_seeder BaseTokensSeeder
            run_seeder TpixTradingPairSeeder
            # คู่เทรดหลักบน BSC (เชนที่ execute จริงผ่าน PancakeSwap) + ปิด placeholder เก่าบน TPIX
            run_seeder BscMajorPairsSeeder
            run_seeder PopularMarketPairsSeeder
            # Token logos — update existing tokens ที่ logo=null (TPIX, USDT จาก TpixPair)
            run_seeder TokenLogosSeeder
            # BSC swap tokens + PancakeSwap V2 config — ให้ /swap/quote รู้จักทุก token ในหน้า Swap
            run_seeder BscSwapTokensSeeder
            # แพลนเช่าบอท AI TRADE (คลาวด์) — ใช้ร่วมกันระหว่างเว็บและแอพ
            run_seeder AiBotPlanSeeder

            # สรุปให้เห็นในหน้า Actions — ตัวเลขนี้ต้องเป็น 0 ทุกรอบ
            if [ "$SEEDERS_FAILED" -gt 0 ]; then
              echo "::error::seeder ล้ม ${SEEDERS_FAILED} ตัว — เปิด storage/logs/laravel-$(date +%F).log บนเซิร์ฟเวอร์ (แถวเดิมยังอยู่ ไม่ต้อง rollback)"
            else
              echo "✅ seeders ทั้งหมดผ่าน"
            fi

            # Fix permissions — แล้วล็อก config.php กลับ เพราะ -R 775 เพิ่งเปิดให้ทั้งกลุ่มอ่าน/เขียน
            chmod -R 775 storage bootstrap/cache 2>/dev/null || true
            lock_config_cache

            # Restart queue workers if running
            php artisan queue:restart 2>/dev/null || true

            # โค้ด schema แคชคอนฟิก/route และ seeder ตรงกันแล้ว — ปล่อย scheduler
            # (trap เรียกซ้ำตอนจบสคริปต์ได้ ไม่มีผลเพราะธงหายไปแล้ว)
            end_deploy_window

            # ── ตัวจับเวลาของ Laravel (บอท AI TRADE พึ่งตัวนี้ทั้งหมด) ──────────
            #
            # ⚠️⚠️ ห้ามกรองด้วย "artisan schedule:run" เฉยๆ เด็ดขาด
            #
            # เครื่องนี้มีหลายแอป deploy มาที่ user เดียวกัน การกรองแบบนั้นลบ
            # schedule:run ของ *ทุกแอป* แล้วเติมกลับเฉพาะของเรา
            # เกิดขึ้นจริง 2026-08-18: main.thaiprompt ตาย 6 รอบใน 3 วัน (รอบหนึ่ง
            # 10 ชม.) · netwix ตาย 2 วัน 20 ชม. รวมถึงตัวเฝ้าเงินเข้าและคิวงาน
            # ต้องกรองด้วย "พาธของเราเอง" เท่านั้น
            APP_DIR="$(pwd)"
            CRON_CMD="cd $APP_DIR && php artisan schedule:run >> /dev/null 2>&1"

            if crontab -l >/dev/null 2>&1 || [ -z "$(crontab -l 2>&1)" ]; then
              # awk index() = เทียบข้อความตรงๆ ไม่ตีความ regex (พาธมี . และ / ปนอยู่)
              # และต้องเข้าเงื่อนไข "พาธของเรา" AND "schedule:run" พร้อมกัน —
              # กรองด้วยพาธอย่างเดียวจะลบ cron อื่นของแอปเดียวกันไปด้วย (เช่น queue worker)
              #
              # ไม่ใช้ sort -u ด้วย เพราะมันจัดลำดับ crontab ของแอปอื่นใหม่ทั้งไฟล์
              (crontab -l 2>/dev/null \
                | awk -v p="$APP_DIR" '!(index($0, p) && index($0, "artisan schedule:run"))'; \
                echo "* * * * * $CRON_CMD") | crontab -

              # ── ยืนยันว่าลงจริง ห้าม echo ✅ ลอยๆ ──────────────────────────
              #
              # ของเดิมพิมพ์ "✅ configured" ทุกกรณีแม้คำสั่งจะล้มเหลว — deploy
              # จึงเขียวตลอดขณะที่บอทไม่ได้เดินเลย ซึ่งเป็นอาการที่หาสาเหตุยากที่สุด
              # เพราะทุกอย่างดู "สำเร็จ" หมด
              if crontab -l 2>/dev/null | grep -qF "$APP_DIR && php artisan schedule:run"; then
                echo "✅ Laravel scheduler cron verified in crontab"
              else
                echo "::error::ตั้ง cron ไม่สำเร็จ — บอท AI TRADE จะไม่เดินบนคลาวด์"
                exit 1
              fi
            else
              echo "::error::เข้าถึง crontab ไม่ได้ — ตัวจับเวลาไม่ทำงาน บอทจะไม่เดิน"
              exit 1
            fi

            echo "✅ Deployment completed successfully!"

      - name: Health Check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          URL="${APP_URL:-https://tpix.online}"
          echo "🔍 Checking health at: ${URL}"
          sleep 5
          HTTP_CODE=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" "${URL}" || echo "000")
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 302 ]; then
            echo "✅ Application is healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE (may still be starting up)"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
