name: Flutter APK Release

on:
  push:
    branches: ['main', 'develop', 'claude/**']
    paths:
      - 'mobile-flutter/**'
      - '.github/workflows/build-flutter-apk.yml'
    # Also trigger on every version tag — ensures APK always ships with
    # release.yml's backend tarball, not just on mobile-flutter pushes.
    tags:
      - 'v*.*.*'
  pull_request:
    branches: ['main']
    paths:
      - 'mobile-flutter/**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        default: 'true'
        type: boolean
      bump_version:
        description: 'Bump version (patch/minor/major/none)'
        required: false
        default: 'none'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      target_tag:
        description: 'Target release tag (e.g. v1.1.64) for attaching APK to an existing release'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  flutter-apk:
    name: Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ประวัติ + tag ครบ — ขั้น "What's new" ต้องหา tag รุ่นก่อนแล้วไล่คอมมิตตั้งแต่ตรงนั้น
          fetch-depth: 0

      - name: Setup Node.js (for version.json)
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'master'
          cache: true

      - name: Flutter info
        run: flutter --version

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            mobile-flutter/.dart_tool
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('mobile-flutter/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # ══════════════════════════════════════════════════
      # Auto-bump version on main branch or manual trigger
      # อัปเวอร์ชันอัตโนมัติทุกครั้งที่ push main หรือ trigger manual
      # ข้าม bump ถ้าถูก trigger จาก tag push (version มาจาก tag แล้ว)
      # หรือถ้า manual dispatch เลือก bump_version=none / ใส่ target_tag
      # ══════════════════════════════════════════════════
      - name: Bump version
        id: bump
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          github.event.inputs.target_tag == '' &&
          (github.ref == 'refs/heads/main' || (github.event.inputs.bump_version != '' && github.event.inputs.bump_version != 'none'))
        working-directory: .
        run: |
          BUMP_TYPE="${{ github.event.inputs.bump_version || 'patch' }}"

          # Read current version from version.json
          CURRENT=$(node -e "console.log(require('./version.json').version)")
          BUILD=$(node -e "console.log(require('./version.json').build || 1)")

          # Calculate new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_BUILD=$((BUILD + 1))

          echo "Bumping version: $CURRENT -> $NEW_VERSION (build $NEW_BUILD)"

          # ── Update version.json ──
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('./version.json', 'utf8'));
            v.version = '$NEW_VERSION';
            v.build = $NEW_BUILD;
            v.releaseDate = new Date().toISOString().split('T')[0];
            fs.writeFileSync('./version.json', JSON.stringify(v, null, 2) + '\n');
          "

          # ── Update mobile-flutter/pubspec.yaml version ──
          sed -i "s/^version: .*/version: $NEW_VERSION+$NEW_BUILD/" mobile-flutter/pubspec.yaml

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "bumped=true" >> $GITHUB_OUTPUT

      # ── Get version (no bump) ──
      # Priority: target_tag input > tag ref > bump step output > version.json
      - name: Get version info
        id: version
        working-directory: .
        run: |
          TARGET_TAG="${{ github.event.inputs.target_tag }}"
          if [ -n "$TARGET_TAG" ]; then
            # Manual dispatch with target_tag — attach APK to existing release
            VERSION="${TARGET_TAG#v}"
            BUILD=$(node -e "console.log(require('./version.json').build || 1)" 2>/dev/null || echo "1")
            echo "=== Target tag mode: v$VERSION (build $BUILD) ==="
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Tag push — use tag version
            VERSION="${GITHUB_REF#refs/tags/v}"
            BUILD=$(node -e "console.log(require('./version.json').build || 1)" 2>/dev/null || echo "1")
            echo "=== Tag push mode: v$VERSION (build $BUILD) ==="
          elif [ "${{ steps.bump.outputs.bumped }}" = "true" ]; then
            VERSION="${{ steps.bump.outputs.version }}"
            BUILD="${{ steps.bump.outputs.build }}"
            echo "=== Bump mode: v$VERSION (build $BUILD) ==="
          elif [ -f version.json ]; then
            VERSION=$(node -e "console.log(require('./version.json').version)" 2>/dev/null || echo "1.0.0")
            BUILD=$(node -e "console.log(require('./version.json').build || 1)" 2>/dev/null || echo "1")
            echo "=== version.json mode: v$VERSION (build $BUILD) ==="
          else
            VERSION="1.0.0"
            BUILD="1"
          fi

          # Sync pubspec.yaml to the resolved version so the built APK matches
          sed -i "s/^version: .*/version: $VERSION+$BUILD/" mobile-flutter/pubspec.yaml

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════
      # What's new — ของที่เปลี่ยนจริงในรุ่นนี้ (คอมมิตของแอปตั้งแต่ tag รุ่นก่อน)
      #
      # บอท Discord ประกาศ "แอปรุ่นใหม่" จากหัวข้อนี้เท่านั้น (DiscordContent::release)
      # เดิม body มีแต่ "Highlights" แม่แบบตายตัวซ้ำทุกรุ่น → ข่าวอัปเดตไม่ตรงความจริง (เจ้าของแจ้ง 2026-10-10)
      # ข้ามคอมมิตที่ผู้ใช้ไม่เห็น: chore (bump เวอร์ชัน) ci build test docs style · ตัด "type(scope): " ออก
      # ไม่มีอะไรเหลือ = ไม่เขียนหัวข้อ → บอทบอกแค่ว่ามีรุ่นใหม่ ไม่เดา
      # ══════════════════════════════════════════════════
      - name: Collect what's new
        id: whatsnew
        working-directory: .
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "v$VERSION" HEAD 2>/dev/null || true)
          RANGE="HEAD"
          [ -n "$PREV" ] && RANGE="$PREV..HEAD"
          echo "Changes since ${PREV:-<first release>}"

          git log "$RANGE" --no-merges --pretty=format:'%s' -- mobile-flutter \
            | grep -Ev '^(chore|ci|build|test|tests|docs|style)(\(|:|!)' \
            | grep -Eiv 'skip ci|bump (flutter )?app' \
            | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?:[[:space:]]*//' \
            | awk 'NF && !seen[$0]++' \
            | head -15 \
            | sed 's/^/- /' > whatsnew.md || true

          {
            echo 'notes<<WHATSNEW_EOF'
            if [ -s whatsnew.md ]; then
              echo "## What's new"
              cat whatsnew.md
              echo
            fi
            echo 'WHATSNEW_EOF'
          } >> "$GITHUB_OUTPUT"
          cat whatsnew.md

      # ══════════════════════════════════════════════════
      # Build
      # ══════════════════════════════════════════════════
      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify persistent keystore
        run: |
          if [ ! -f android/app/tpix-trade.keystore ]; then
            echo "ERROR: Persistent keystore missing at android/app/tpix-trade.keystore"
            echo "This is required for consistent APK signing across builds"
            exit 1
          fi
          echo "✓ Persistent keystore found — builds will sign with same key"

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ steps.version.outputs.build }}

      - name: Find and rename APK
        id: apk
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            find build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          APK_NAME="TPIX-TRADE-v${{ steps.version.outputs.version }}.apk"
          cp "$APK_PATH" "$APK_NAME"
          APK_SIZE=$(stat -c%s "$APK_NAME" 2>/dev/null || stat -f%z "$APK_NAME")
          APK_SIZE_MB=$(echo "scale=1; $APK_SIZE / 1048576" | bc)
          echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE_MB}MB" >> $GITHUB_OUTPUT
          echo "=== APK: $APK_NAME ($APK_SIZE_MB MB) ==="

      # ถอด upload-artifact ออกแล้ว — APK ถูกแนบเข้า Release ทุกรอบอยู่แล้ว
      # เก็บเป็น artifact ซ้ำอีกชุดคือกินโควต้าพื้นที่เปล่า ๆ (เคยค้างไว้ 424 MB)
      # ไฟล์ใน Release อยู่คนละถังกับ Actions storage จึงไม่นับโควต้า

      # ══════════════════════════════════════════════════
      # Commit version bump กลับ repo
      # ══════════════════════════════════════════════════
      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json mobile-flutter/pubspec.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: bump flutter app to v${{ steps.version.outputs.version }}"

          # Retry push 3 ครั้ง พร้อม rebase — กัน race condition กับ dev push
          # --autostash กัน build artifacts ทำให้ pull fail
          for i in 1 2 3; do
            echo "Push attempt $i..."
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed, rebasing and retrying..."
            git pull --rebase --autostash origin main || true
          done
          echo "WARN: Push failed after 3 attempts — continuing build (non-blocking)"
          exit 0

      # ══════════════════════════════════════════════════
      # Create GitHub Release + แนบ APK อัตโนมัติ
      # รันเมื่อ:
      #   - push main (after bump)
      #   - push tag v*.*.* (release.yml created the tag, we add the APK)
      #   - manual dispatch with create_release=true OR target_tag set
      # softprops/action-gh-release@v3 จะ update release ที่มีอยู่แล้ว
      # โดย append APK เป็น asset ใหม่ (ไม่ลบ tarball เดิม)
      # ══════════════════════════════════════════════════
      - name: Create Release with APK
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event.inputs.create_release == 'true' ||
          github.event.inputs.target_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 'TPIX TRADE v${{ steps.version.outputs.version }}'
          generate_release_notes: true
          append_body: true
          body: |

            ${{ steps.whatsnew.outputs.notes }}
            ---
            ## Android APK (Flutter)

            | | |
            |---|---|
            | **Version** | v${{ steps.version.outputs.version }} |
            | **Size** | ${{ steps.apk.outputs.apk_size }} |
            | **Min Android** | 7.0 (API 24) |
            | **Framework** | Flutter 3.38 |

            ### Install
            1. Download **${{ steps.apk.outputs.apk_name }}** below
            2. Open on Android device
            3. Allow "Install from unknown sources" if prompted

          files: mobile-flutter/${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ══════════════════════════════════════════════════
      # แจ้ง backend ว่ามี release ใหม่ (clear cache + set active_tag)
      # ══════════════════════════════════════════════════
      - name: Notify backend of new release
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event.inputs.create_release == 'true' ||
          github.event.inputs.target_tag != ''
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -n "$DEPLOY_SECRET" ]; then
            echo "Notifying backend: v${{ steps.version.outputs.version }}"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://tpix.online/api/v1/app/notify-release?secret=${DEPLOY_SECRET}&tag=v${{ steps.version.outputs.version }}" \
              -H "User-Agent: GitHub-Actions" \
              -H "Accept: application/json")
            echo "Backend response: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Backend notified successfully"
            else
              echo "Backend notify returned $HTTP_CODE (non-critical)"
            fi
          else
            echo "DEPLOY_SECRET not set — skipping backend notify"
          fi

      # ══════════════════════════════════════════════════
      # Build Summary
      # ══════════════════════════════════════════════════
      - name: Build Summary
        if: always()
        run: |
          echo "## TPIX TRADE — Flutter APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | v${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ steps.apk.outputs.apk_path }}" ]; then
            echo "| **APK Size** | ${{ steps.apk.outputs.apk_size }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Status** | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Status** | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

      # ---- ลบ Release เก่าเมื่อปล่อยตัวใหม่สำเร็จ เก็บไว้ 10 รุ่นล่าสุด ----
      #
      # ผู้ใช้โหลดผ่าน tpix.online แล้ว GitHub Release เหลือหน้าที่แค่เป็นที่เก็บไฟล์
      # เก็บ 10 รุ่นไว้ให้แอดมินย้อนรุ่นได้จากหน้า App Releases ที่เก่ากว่านั้นลบทิ้ง
      # รวม release ยุค React Native ด้วย (เจ้าของเลือก 2026-10-22)
      #
      # ★ ตั้งแต่เพิ่มขั้นนี้ 2026-08-23 ถึง 2026-10-22 ไม่เคยลบอะไรได้สักรอบ
      #   ตัวกรองเดิม test("\.apk$") เป็น escape ที่ jq ไม่รับ แล้ว `|| echo 0` กลบ error
      #   ทุกรอบจึงขึ้นแค่ "ไม่มีไฟล์ที่ตรงเงื่อนไข" ไม่มีใครรู้ว่าพัง
      #   ตอนนี้ใช้ endswith(".apk") ไม่มี backslash ให้พลาด และอ่านไม่ได้ต้องบอกว่าอ่านไม่ได้
      #
      # สั่งลบอัตโนมัติแล้วพลาด = กู้ไม่ได้ จึงมีด่านกัน
      #   1. Release ที่เพิ่งปล่อยต้องมีไฟล์ .apk จริง ไม่มีหรืออ่านไม่ได้ = ไม่ลบอะไรเลย
      #      กันเคสบิลด์เพี้ยนแล้วลบของเก่าจนไม่เหลืออะไรให้โหลดสักตัว
      #   2. คัดเฉพาะ Release ที่มี .apk — release ของเว็บ (ci.yml) ใช้ tag ชุดเดียวกัน
      #      แต่ไม่มีไฟล์แนบ ต้องไม่โดนลบ
      #   3. อ่านรายการครบทุกหน้าก่อน (repo มี release หลายร้อยตัว) อ่านไม่ครบ = ไม่ลบอะไรเลย
      #   4. ไม่ลบรุ่นที่เพิ่งแนบไฟล์รอบนี้ แม้จะเก่ากว่า 10 อันดับ (target_tag ย้อนแนบรุ่นเก่า)
      #   5. พิมพ์รายการที่จะลบทั้งหมดลง log และ Summary ก่อนลบตัวแรก
      #   6. ลบเฉพาะตัว Release ไม่แตะ tag — ย้อนสร้างใหม่จาก source ได้เสมอ
      #   7. continue-on-error — ลบพลาดต้องไม่ทำให้รอบที่ปล่อยรุ่นสำเร็จกลายเป็นล้มเหลว
      # อยากเห็นก่อนว่าจะลบอะไร: ตั้ง DRY_RUN: 'true' = พิมพ์รายการอย่างเดียว ไม่ลบ
      - name: Prune old releases (keep newest 10)
        continue-on-error: true
        if: >-
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          startsWith(github.ref, 'refs/tags/') ||
          github.event.inputs.create_release == 'true' ||
          github.event.inputs.target_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: '10'
          DRY_RUN: 'false'
          CURRENT_TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          # KEEP ว่างหรือเพี้ยน = tail -n +1 = ลบทุกตัว ต้องหยุดตรงนี้
          case "$KEEP" in
            '' | *[!0-9]* | 0) echo "::error::KEEP ต้องเป็นจำนวนเต็มบวก ได้ '$KEEP'"; exit 1 ;;
          esac

          # error ของ gh/jq ต้องโผล่ใน log ห้ามกลบ (บทเรียนจากตัวกรองเดิม)
          if ! have=$(gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '[.assets[].name | ascii_downcase | select(endswith(".apk"))] | length'); then
            echo "::warning::อ่าน release $CURRENT_TAG ไม่ได้ จึงไม่ลบอะไรทั้งสิ้น"
            exit 0
          fi
          if ! [ "$have" -ge 1 ] 2>/dev/null; then
            echo "::warning::$CURRENT_TAG ไม่มีไฟล์ .apk จึงไม่ลบอะไรทั้งสิ้น"
            exit 0
          fi
          echo "$CURRENT_TAG มีไฟล์ .apk $have ชิ้น"

          # release ที่มี .apk ทุกหน้า → created_at <tab> id <tab> tag เรียงใหม่ไปเก่า
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq '.[] | select(.draft | not) | select([.assets[].name | ascii_downcase | endswith(".apk")] | any) | [.created_at, .id, .tag_name] | @tsv' \
                > apk-releases.tsv; then
            echo "::warning::อ่านรายการ release ไม่ครบ จึงไม่ลบอะไรทั้งสิ้น"
            exit 0
          fi
          LC_ALL=C sort -r -o apk-releases.tsv apk-releases.tsv

          tail -n +"$((KEEP + 1))" apk-releases.tsv | awk -F'\t' -v cur="$CURRENT_TAG" '$3 != cur' > old.tsv
          total=$(wc -l < apk-releases.tsv)
          count=$(wc -l < old.tsv)

          echo "release ที่มี .apk $total ตัว เก็บ $KEEP ตัวล่าสุด จะลบ $count ตัว (ไม่แตะ tag):"
          awk -F'\t' '{ printf "  %s  created %s  id=%s\n", $3, $1, $2 }' old.tsv
          {
            echo "### Prune old releases"
            echo "release ที่มี .apk $total ตัว · เก็บ $KEEP ตัวล่าสุด · จะลบ $count ตัว (DRY_RUN=$DRY_RUN)"
            if [ "$count" -gt 0 ]; then
              echo
              cut -f3 old.tsv | paste -sd ' ' -
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -eq 0 ]; then
            echo "ไม่มีของเก่าให้ลบ"
            exit 0
          fi
          if [ "$DRY_RUN" = 'true' ]; then
            echo "DRY_RUN — แสดงรายการอย่างเดียว ไม่ได้ลบ"
            exit 0
          fi

          deleted=0
          while IFS=$'\t' read -r _ id tag; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" --silent; then
              echo "  ลบ $tag แล้ว"
              deleted=$((deleted + 1))
            else
              echo "::warning::ลบ $tag (id=$id) ไม่สำเร็จ"
            fi
            # GitHub ขอให้เว้นอย่างน้อย 1 วิระหว่างคำสั่งที่แก้ข้อมูล รอบแรกลบหลายสิบตัว
            sleep 1
          done < old.tsv

          echo "ลบไป $deleted จาก $count รายการ"
          echo "ลบสำเร็จ $deleted จาก $count" >> "$GITHUB_STEP_SUMMARY"
