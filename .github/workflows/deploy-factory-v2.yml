name: Deploy Token Factory V2 + NFT Factory (DEPRECATED)

# ⛔ ยกเลิกแล้ว — ห้าม deploy แฟกทอรีจาก repo นี้
#
# workflow เดิมคอมไพล์สำเนาสัญญาเก่าใน contracts/factory ด้วย evmVersion cancun
# (bytecode เกินเพดาน EIP-170 และคนละรุ่นกับ ABI ที่เว็บใช้) แล้ว deploy ขึ้นเชนจริง
#
# สัญญาแฟกทอรีอยู่ที่ repo TPIX-Coin (contracts/src/token-factory, solc 0.8.24,
# evmVersion london) — deploy จากที่นั่น แล้วลงทะเบียนที่อยู่ผ่าน /api/infra/contracts
on:
  workflow_dispatch:

jobs:
  deprecated:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to deploy from this repo
        run: |
          echo "::error::workflow นี้ถูกยกเลิก — deploy แฟกทอรีจาก repo TPIX-Coin แล้วลงทะเบียนที่อยู่ผ่าน /api/infra/contracts"
          exit 1
